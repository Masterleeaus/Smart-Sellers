name: Chatbot Vertical Templates

on:
  pull_request:
    paths:
      - 'app/extensions/Chatbot/System/Titan/**'
      - 'app/extensions/Chatbot/System/TitanShell/**'
      - 'app/extensions/Chatbot/System/Http/Controllers/Api/TitanController.php'
      - 'app/extensions/Chatbot/resources/titan-apps/**'
      - 'app/extensions/Chatbot/tests/architecture/test_vertical_template_*.py'
      - '.github/workflows/chatbot-vertical-templates.yml'

permissions:
  contents: read

concurrency:
  group: chatbot-vertical-templates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON catalogues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('app/extensions/Chatbot/resources/titan-apps')
          files = list((root / 'TemplateCatalogues').glob('*.json')) + list((root / 'TemplateSchemas').glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'validated {len(files)} JSON files')
          PY

      - name: Run vertical architecture contracts
        run: |
          python - <<'PY'
          import runpy
          from pathlib import Path

          paths = [
              Path('app/extensions/Chatbot/tests/architecture/test_vertical_template_catalogue.py'),
              Path('app/extensions/Chatbot/tests/architecture/test_vertical_template_composition.py'),
          ]

          count = 0
          for path in paths:
              namespace = runpy.run_path(str(path))
              for name, value in sorted(namespace.items()):
                  if name.startswith('test_') and callable(value):
                      value()
                      count += 1
          print(f'passed {count} vertical architecture contracts')
          PY

      - name: PHP syntax
        run: |
          php -l app/extensions/Chatbot/System/Titan/TitanRegistry.php
          php -l app/extensions/Chatbot/System/TitanShell/TemplateSchema.php
          php -l app/extensions/Chatbot/System/Http/Controllers/Api/TitanController.php
